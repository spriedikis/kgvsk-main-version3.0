<style>
        /* Stili galerijai */
        .gallery {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 900px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- button to show photos -->
    <a class="btn btn-ghost" 
       href="eksameni.pdf" 
       target="_blank" 
       rel="noopener noreferrer" 
       onclick="showPhotos(event)">Eksāmeni 2026./2027. mācību gadā</a>

    <!-- foto gallery -->
    <div class="gallery" id="photoGallery">
        <img src="11.png" alt="Eksāmenu grafiks 1" onclick="openModal(this)">
        <img src="22.png" alt="Eksāmenu grafiks 2" onclick="openModal(this)">
        <img src="33.png" alt="Eksāmenu grafiks 3" onclick="openModal(this)">
        <img src="44.png" alt="Eksāmenu grafiks 4" onclick="openModal(this)">
    </div>

    <!-- modal for enlarged photo -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <img id="modalImg" src="" alt="Palielināts attēls">
    </div>

    <script>
        // foto click event
        function showPhotos(event) {
            event.preventDefault();
            const gallery = document.getElementById('photoGallery');
            gallery.style.display = 'grid';
        }

        // foto uz visu ēkrānu
        function openModal(imgElement) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            
            modal.style.display = 'flex';
            modalImg.src = imgElement.src;
        }

        //close modal click
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
      </div>
    </section>
